{% extends "base.html" %}

{% block title %}
Add Aircraft
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div>
                <a class="btn btn-outline-light btn-sm"
                href="{% url 'aircraft_list' %}">
                    Aircraft
                </a>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Aircraft ID</label>

                        <input
                            type="text"
                            name="aircraftid"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Model</label>

                        <input
                            type="text"
                            name="model"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Manufacturer</label>

                        <input
                            type="text"
                            name="manufacturer"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Seating Capacity
                        </label>

                        <input
                            type="number"
                            name="seating_capacity"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Registration Number
                        </label>

                        <input
                            type="text"
                            name="registration_no"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Save Aircraft
                        </button>

                        <a
                            href="{% url 'aircraft_list' %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
